project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
  resources:
    - "images/**"

website:
  title: "Arctic Ocean"
  description: |
    Summary Report of Arctic Ocean In Situ Observations
  navbar:
    logo: images/logo.png
    logo-href: https://aiqc-hub.github.io/aiqc-report/
    logo-alt: "AIQC"
    # Quarto folds the site title into the same brand link as the logo, so with
    # logo-href set the title pointed at the portal too and nothing led home.
    # Distill kept them apart: logo -> portal, title -> index. Suppress the
    # brand title and put it back as an ordinary left-hand nav item.
    title: false
    left:
      - text: "Arctic Ocean"
        href: index.qmd
    tools:
      - icon: github
        href: https://github.com/AIQC-Hub/arc-report
        text: "Source on GitHub"
    right:
      - text: "Profile Summary"
        menu:
          - text: "Summary (AR)"
            href: ar_summary.qmd
          - text: "Summary (GL)"
            href: ar_gl_summary.qmd
          - text: "Summary (CORA)"
            href: ar_cora_summary.qmd
      - text: "Temperature"
        menu:
          - text: "Temp (AR)"
            href: ar_temp.qmd
          - text: "Temp (GL)"
            href: ar_gl_temp.qmd
          - text: "Temp (CORA)"
            href: ar_cora_temp.qmd
          - text: "---"
          - text: "Temp QC (AR)"
            href: ar_temp_qc.qmd
          - text: "Temp QC (GL)"
            href: ar_gl_temp_qc.qmd
          - text: "Temp QC (CORA)"
            href: ar_cora_temp_qc.qmd
      - text: "Salinity"
        menu:
          - text: "Psal (AR)"
            href: ar_psal.qmd
          - text: "Psal (GL)"
            href: ar_gl_psal.qmd
          - text: "Psal (CORA)"
            href: ar_cora_psal.qmd
          - text: "---"
          - text: "Psal QC (AR)"
            href: ar_psal_qc.qmd
          - text: "Psal QC (GL)"
            href: ar_gl_psal_qc.qmd
          - text: "Psal QC (CORA)"
            href: ar_cora_psal_qc.qmd

format:
  html:
    toc: true
    toc-depth: 2
